<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact | Oak &amp; Loom</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary d-flex flex-column min-vh-100">
    <nav id="siteNav" class="navbar navbar-expand-lg bg-dark" data-bs-theme="dark" aria-label="Main navigation">
        <div id="navInner" class="container">
            <a id="brand" class="navbar-brand fw-semibold" href="index.html">Oak &amp; Loom</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
        data-bs-target="#mainNavigation" aria-controls="mainNavigation"
        aria-expanded="false" aria-label="Toggle navigation">
    <span class="navbar-toggler-icon"></span>
</button>
            <div id="mainNavigation" class="collapse navbar-collapse">
                <ul id="navLinks" class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
<li class="nav-item"><a class="nav-link" href="products.html">Products</a></li>
<li class="nav-item"><a class="nav-link" href="cart.html">Cart</a></li>
<li class="nav-item"><a class="nav-link active" href="contact.html" aria-current="page">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <main id="pageContent" class="container py-4 py-lg-5">
        <div id="contactRow" class="row justify-content-center">
            <section id="contactColumn" class="col-lg-8">
                <div id="contactCard" class="card shadow-sm">
                    <div id="contactBody" class="card-body p-4">
                        <h1 class="h2">Ask about a piece</h1>
                        <p class="text-secondary">This classroom form checks input in the browser. It does not send or store an enquiry.</p>
                        <form id="enquiryForm" class="row g-3" action="contact.html" method="get">
                            <div id="nameGroup" class="col-md-6">
                                <label class="form-label" for="customerName">Name</label>
                                <input class="form-control" id="customerName" name="name" type="text" required>
                            </div>
                            <div id="emailGroup" class="col-md-6">
                                <label class="form-label" for="customerEmail">Email</label>
                                <input class="form-control" id="customerEmail" name="email" type="email" required>
                            </div>
                            <div id="productGroup" class="col-12">
                                <label class="form-label" for="productChoice">Product</label>
                                <select class="form-select" id="productChoice" name="product" required>
                                    <option value="">Choose a piece</option>
                                    <option>Marlow lounge chair</option><option>Haven dining table</option><option>Rowan sideboard</option><option>Alder bookshelf</option>
                                </select>
                            </div>
                            <div class="col-12">
    <label class="form-label" for="message">Your question</label>
    <textarea class="form-control" id="message" name="message" rows="4" required></textarea>
</div>
<div class="col-12">
    <div class="form-check">
        <input class="form-check-input" type="checkbox" id="updates" name="updates" value="yes">
        <label class="form-check-label" for="updates">Send me collection updates</label>
    </div>
</div>
                            <div id="submitGroup" class="col-12"><button class="btn btn-success" type="submit">Check enquiry</button></div>
                        </form>
                    </div>
                </div>
            </section>
        </div>
    </main>
    <footer id="siteFooter" class="border-top bg-white py-4 mt-auto">
        <div id="footerInner" class="container d-flex flex-column flex-sm-row justify-content-between gap-2">
            <p class="mb-0 fw-semibold">Oak &amp; Loom</p>
            <p class="mb-0 text-secondary">Furniture for considered spaces</p>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
